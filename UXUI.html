
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{display:flex;height:600px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
.sidebar{width:200px;min-width:200px;background:var(--color-background-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;padding:0}
.sidebar-header{padding:16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--color-text-info);flex-shrink:0}
.sidebar-header-text p{font-size:12px;color:var(--color-text-secondary);margin:0}
.sidebar-header-text strong{font-size:13px;color:var(--color-text-primary);font-weight:500}
.nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;transition:background 0.15s;border-radius:0}
.nav-item:hover{background:var(--color-background-tertiary);color:var(--color-text-primary)}
.nav-item.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border-right:2px solid #1D9E75}
.nav-item i{font-size:17px;width:20px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:0.5px solid var(--color-border-tertiary);font-size:11px;color:var(--color-text-tertiary);line-height:1.6;cursor:pointer}
.sidebar-footer span{display:block}
.sidebar-footer span:hover{color:var(--color-text-secondary)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;gap:10px}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--color-text-tertiary)}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;background:var(--color-background-primary);color:var(--color-text-primary);outline:none}
.search-wrap input:focus{border-color:var(--color-border-primary)}
.filters{display:flex;gap:8px}
.filter-btn{padding:5px 12px;border:0.5px solid var(--color-border-secondary);border-radius:20px;font-size:12px;background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s}
.filter-btn.active,.filter-btn:hover{background:#1D9E75;color:#fff;border-color:#1D9E75}
.products-area{flex:1;overflow-y:auto;padding:14px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.product-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);overflow:hidden;transition:box-shadow 0.15s;cursor:default}
.product-card:hover{border-color:var(--color-border-secondary)}
.product-img{width:100%;aspect-ratio:1;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;border-bottom:0.5px solid var(--color-border-tertiary)}
.product-img i{font-size:32px;color:var(--color-text-tertiary)}
.product-info{padding:8px 10px}
.product-name{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px;line-height:1.3}
.product-seller{font-size:11px;color:var(--color-text-secondary);margin-bottom:6px}
.product-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.product-price{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.product-dist{font-size:11px;color:var(--color-text-secondary)}
.btn-order{width:100%;padding:6px;background:#1D9E75;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;transition:background 0.15s;font-family:var(--font-sans)}
.btn-order:hover{background:#0F6E56}
.btn-order:active{transform:scale(0.98)}
.toast{position:fixed;bottom:20px;right:20px;background:#1D9E75;color:#fff;padding:10px 16px;border-radius:var(--border-radius-md);font-size:13px;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
</style>

<h2 class="sr-only">Painel do Comerciante — busca e pedido de produtos de fornecedores</h2>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="avatar">UC</div>
      <div class="sidebar-header-text">
        <strong>Usuário</strong>
        <p>Comerciante</p>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-item active"><i class="ti ti-home" aria-hidden="true"></i> Início</div>
      <div class="nav-item"><i class="ti ti-headset" aria-hidden="true"></i> Contato</div>
      <div class="nav-item"><i class="ti ti-clipboard-list" aria-hidden="true"></i> Acompanhar pedidos</div>
      <div class="nav-item"><i class="ti ti-truck-delivery" aria-hidden="true"></i> Acompanhar entregas</div>
      <div class="nav-item"><i class="ti ti-shopping-bag" aria-hidden="true"></i> Meus pedidos</div>
    </nav>
    <div class="sidebar-footer">
      <span>Fale conosco</span>
      <span>Termos e condições</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="searchInput" placeholder="Buscar produtos..." oninput="filterProducts()">
      </div>
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('barato',this)">Mais Barato</button>
        <button class="filter-btn" onclick="setFilter('proximo',this)">Mais Próximo</button>
        <button class="filter-btn" onclick="setFilter('avaliado',this)">Melhor Avaliado</button>
      </div>
    </div>
    <div class="products-area">
      <div class="products-grid" id="grid"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const allProducts=[
  {name:"Farinha de Trigo 5kg",seller:"Fornecedor Central",price:45.00,dist:2.5,rating:4.8,icon:"ti-wheat"},
  {name:"Farinha de Kg",seller:"Fornecedor Central",price:10.00,dist:2.5,rating:4.5,icon:"ti-wheat"},
  {name:"Farinha de 2kg",seller:"Fornecedor Central",price:22.00,dist:2.5,rating:4.6,icon:"ti-wheat"},
  {name:"Farinha de Trigo 5kg",seller:"Moinho Norte",price:43.00,dist:3.1,rating:4.9,icon:"ti-wheat"},
  {name:"Farinha de Trigo 5kg",seller:"Distribuidora Sul",price:47.00,dist:1.2,rating:4.3,icon:"ti-wheat"},
  {name:"Arroz Branco 5kg",seller:"Fornecedor Central",price:32.00,dist:2.5,rating:4.7,icon:"ti-bowl-rice"},
  {name:"Feijão Carioca 2kg",seller:"Moinho Norte",price:18.00,dist:3.1,rating:4.4,icon:"ti-salad"},
  {name:"Açúcar Refinado 5kg",seller:"Distribuidora Sul",price:28.00,dist:1.2,rating:4.6,icon:"ti-candy"},
  {name:"Sal Refinado 1kg",seller:"Fornecedor Central",price:4.50,dist:2.5,rating:4.2,icon:"ti-droplet"},
  {name:"Óleo de Soja 900ml",seller:"Moinho Norte",price:8.90,dist:3.1,rating:4.5,icon:"ti-bottle"},
];
let currentFilter='barato';
let currentSearch='';

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}
function filterProducts(){
  currentSearch=document.getElementById('searchInput').value.toLowerCase();
  renderGrid();
}
function getSorted(){
  let arr=[...allProducts].filter(p=>p.name.toLowerCase().includes(currentSearch)||p.seller.toLowerCase().includes(currentSearch));
  if(currentFilter==='barato') arr.sort((a,b)=>a.price-b.price);
  else if(currentFilter==='proximo') arr.sort((a,b)=>a.dist-b.dist);
  else arr.sort((a,b)=>b.rating-a.rating);
  return arr;
}
function showToast(name){
  const t=document.getElementById('toast');
  t.textContent=`"${name}" adicionado ao pedido!`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function renderGrid(){
  const g=document.getElementById('grid');
  const products=getSorted();
  if(!products.length){g.innerHTML='<p style="color:var(--color-text-secondary);font-size:13px;grid-column:1/-1;">Nenhum produto encontrado.</p>';return;}
  g.innerHTML=products.map((p,i)=>`
    <div class="product-card">
      <div class="product-img"><i class="ti ${p.icon}" aria-hidden="true"></i></div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-seller">${p.seller}</div>
        <div class="product-meta">
          <span class="product-price">R$ ${p.price.toFixed(2)}</span>
          <span class="product-dist">${p.dist} km</span>
        </div>
        <button class="btn-order" onclick="showToast('${p.name}')">Encomendar</button>
      </div>
    </div>
  `).join('');
}
renderGrid();
</script>
