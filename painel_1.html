<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Comerciante</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --bg: #f5f5f3;
      --bg-card: #ffffff;
      --bg-sidebar: #f0efed;
      --border: #e0deda;
      --text: #1a1a18;
      --text-muted: #888780;
      --radius: 8px;
      --radius-lg: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      display: flex;
      width: 960px;
      height: 600px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-card);
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--bg-sidebar);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #d4f0e6;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: var(--green-dark);
      flex-shrink: 0;
    }
    .sidebar-header-text strong { font-size: 13px; color: var(--text); display: block; }
    .sidebar-header-text span { font-size: 11px; color: var(--text-muted); }

    .nav { flex: 1; padding: 8px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px;
      font-size: 13px; color: var(--text-muted);
      cursor: pointer; transition: background 0.15s;
    }
    .nav-item:hover { background: rgba(0,0,0,0.04); color: var(--text); }
    .nav-item.active {
      background: var(--bg-card);
      color: var(--text);
      font-weight: 500;
      border-right: 2px solid var(--green);
    }
    .nav-item i { font-size: 17px; width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 0.5px solid var(--border);
      font-size: 11px; color: var(--text-muted); line-height: 1.8;
    }
    .sidebar-footer span { display: block; cursor: pointer; }
    .sidebar-footer span:hover { color: var(--text); }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border);
      display: flex; flex-direction: column; gap: 10px;
    }
    .search-wrap { position: relative; }
    .search-wrap i {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 16px; color: var(--text-muted);
    }
    .search-wrap input {
      width: 100%; padding: 8px 12px 8px 34px;
      border: 0.5px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--bg-card); color: var(--text);
      outline: none; transition: border 0.15s;
    }
    .search-wrap input:focus { border-color: var(--green); }

    .filters { display: flex; gap: 8px; }
    .filter-btn {
      padding: 5px 12px;
      border: 0.5px solid var(--border); border-radius: 20px;
      font-size: 12px; background: var(--bg-card); color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--green); color: #fff; border-color: var(--green);
    }

    /* GRID */
    .products-area { flex: 1; overflow-y: auto; padding: 14px; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; transition: border-color 0.15s;
    }
    .product-card:hover { border-color: #b0b0a8; }

    .product-img {
      width: 100%; aspect-ratio: 1;
      background: var(--bg-sidebar);
      display: flex; align-items: center; justify-content: center;
      border-bottom: 0.5px solid var(--border);
    }
    .product-img i { font-size: 32px; color: var(--text-muted); }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }

    .product-info { padding: 8px 10px; }
    .product-name {
      font-size: 12px; font-weight: 500; color: var(--text);
      margin-bottom: 2px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-seller { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .product-meta {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .product-price { font-size: 13px; font-weight: 600; color: var(--text); }
    .product-badge { font-size: 11px; color: var(--text-muted); }

    .stars { font-size: 11px; color: #f59e0b; margin-bottom: 6px; }

    .btn-order {
      width: 100%; padding: 6px;
      background: var(--green); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 12px; cursor: pointer; transition: background 0.15s;
      text-decoration: none; display: block; text-align: center;
    }
    .btn-order:hover { background: var(--green-dark); }
    .btn-order:active { transform: scale(0.98); }

    /* ESTADO VAZIO / LOADING */
    .status-msg {
      color: var(--text-muted); font-size: 13px;
      grid-column: 1 / -1; padding: 24px 0; text-align: center;
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--green); color: #fff;
      padding: 10px 18px; border-radius: var(--radius);
      font-size: 13px; opacity: 0; transform: translateY(10px);
      transition: all 0.3s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="avatar">UC</div>
      <div class="sidebar-header-text">
        <strong>Usuário</strong>
        <span>Comerciante</span>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-item active"><i class="ti ti-home"></i> Início</div>
      <div class="nav-item"><i class="ti ti-headset"></i> Contato</div>
      <div class="nav-item"><i class="ti ti-clipboard-list"></i> Acompanhar pedidos</div>
      <div class="nav-item"><i class="ti ti-truck-delivery"></i> Acompanhar entregas</div>
      <div class="nav-item"><i class="ti ti-shopping-bag"></i> Meus pedidos</div>
    </nav>
    <div class="sidebar-footer">
      <span>Fale conosco</span>
      <span>Termos e condições</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar produtos (ex: farinha de trigo 5kg)..." oninput="onSearch()" />
      </div>
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('barato', this)">Mais Barato</button>
        <button class="filter-btn" onclick="setFilter('avaliado', this)">Melhor Avaliado</button>
      </div>
    </div>
    <div class="products-area">
      <div class="products-grid" id="grid">
        <p class="status-msg">Digite um produto acima para buscar os melhores preços.</p>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  // ⚙️ Aponte para o seu servidor local
  const API_BASE = 'http://localhost:3001';

  let allProducts = [];
  let currentFilter = 'barato';
  let debounceTimer = null;

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  function onSearch() {
    const query = document.getElementById('searchInput').value.trim();
    clearTimeout(debounceTimer);
    if (!query) {
      allProducts = [];
      renderGrid();
      return;
    }
    debounceTimer = setTimeout(() => fetchProducts(query), 600);
  }

  async function fetchProducts(query) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '<p class="status-msg"><i class="ti ti-loader-2"></i> Buscando melhores preços...</p>';

    try {
      const res = await fetch(`${API_BASE}/buscar?q=${encodeURIComponent(query)}`);
      allProducts = await res.json();
      renderGrid();
    } catch (err) {
      grid.innerHTML = '<p class="status-msg">Erro ao conectar com o servidor. Verifique se o <code>server.js</code> está rodando.</p>';
    }
  }

  function getSorted() {
    const arr = [...allProducts];
    if (currentFilter === 'barato') arr.sort((a, b) => a.price - b.price);
    else arr.sort((a, b) => b.rating - a.rating);
    return arr;
  }

  function renderGrid() {
    const g = document.getElementById('grid');
    const products = getSorted();

    if (!products.length) {
      g.innerHTML = '<p class="status-msg">Nenhum produto encontrado.</p>';
      return;
    }

    g.innerHTML = products.map(p => `
      <div class="product-card">
        <div class="product-img">
          ${p.thumbnail
            ? `<img src="${p.thumbnail}" alt="${p.name}" loading="lazy" />`
            : `<i class="ti ti-shopping-bag"></i>`}
        </div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-seller">${p.seller}</div>
          ${p.rating ? `<div class="stars">${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5 - Math.round(p.rating))} <span style="color:var(--text-muted)">${p.rating.toFixed(1)}</span></div>` : ''}
          <div class="product-meta">
            <span class="product-price">${p.price > 0 ? 'R$ ' + p.price.toFixed(2) : 'Ver preço'}</span>
            <span class="product-badge">Online</span>
          </div>
          <a class="btn-order" href="${p.link}" target="_blank" rel="noopener">Ver na loja ↗</a>
        </div>
      </div>
    `).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
